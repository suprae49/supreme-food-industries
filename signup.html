<!DOCTYPE html>
<html lang="ne">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>साइन अप · सुप्रिम खाद्य उद्योग</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="grain" aria-hidden="true"></div>
    <div class="auth-shell">
      <aside class="auth-visual" aria-hidden="true">
        <img src="assets/facebook/product_1.jpg" alt="" />
        <div class="auth-visual-copy">
          <p class="auth-brand-ne">सुप्रिम ब्राण्ड</p>
          <p class="auth-brand-en">Create your account</p>
        </div>
      </aside>

      <main class="auth-main">
        <a class="auth-back" href="index.html">← गृहपृष्ठ</a>
        <h1>साइन अप</h1>
        <p class="auth-lede">अर्डर र थोक सोधपुछका लागि खाता बनाउनुहोस्।</p>

        <form class="auth-form" id="signup-form" novalidate>
          <label>
            <span>नाम</span>
            <input
              type="text"
              name="name"
              placeholder="तपाईंको नाम"
              autocomplete="name"
              required
            />
          </label>
          <label>
            <span>मोबाइल</span>
            <input
              type="tel"
              name="phone"
              inputmode="numeric"
              placeholder="९८XXXXXXXX"
              autocomplete="tel"
              required
            />
          </label>
          <label>
            <span>पासवर्ड</span>
            <input
              type="password"
              name="password"
              placeholder="कम्तीमा ४ अक्षर"
              autocomplete="new-password"
              required
            />
          </label>
          <label>
            <span>पासवर्ड फेरि</span>
            <input
              type="password"
              name="confirm"
              placeholder="पासवर्ड दोहोर्याउनुहोस्"
              autocomplete="new-password"
              required
            />
          </label>
          <p class="auth-error" id="signup-error" hidden></p>
          <button class="btn btn-primary" type="submit">खाता खोल्नुहोस्</button>
        </form>

        <p class="auth-switch">
          पहिले नै खाता छ?
          <a href="login.html">लगइन गर्नुहोस्</a>
        </p>
        <p class="auth-demo-note">खाता Flask backend + SQLite मा सेभ हुन्छ।</p>
      </main>
    </div>

    <script src="auth.js"></script>
    <script>
      if (getSession()) {
        window.location.replace("index.html");
      }

      const form = document.getElementById("signup-form");
      const errorEl = document.getElementById("signup-error");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        const data = new FormData(form);
        const password = String(data.get("password") || "");
        const confirm = String(data.get("confirm") || "");
        const submitBtn = form.querySelector('button[type="submit"]');

        if (password !== confirm) {
          errorEl.hidden = false;
          errorEl.textContent = "पासवर्ड मिलेन। फेरि जाँच गर्नुहोस्।";
          return;
        }

        submitBtn.disabled = true;
        try {
          const result = await signupUser({
            name: data.get("name"),
            phone: data.get("phone"),
            password,
          });

          if (!result.ok) {
            errorEl.hidden = false;
            errorEl.textContent = result.error;
            return;
          }

          window.location.href = "index.html";
        } catch {
          errorEl.hidden = false;
          errorEl.textContent = "सर्भरसँग जोडिन सकिएन।";
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
